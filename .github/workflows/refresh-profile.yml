name: Refresh shipping board

on:
  schedule:
    # Mondays at 06:17 UTC. Off the hour on purpose: scheduled jobs on the hour
    # queue behind everyone else's and get delayed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild board and shipping log
        env:
          # PROFILE_TOKEN is optional. The default Actions token can list repos
          # but may not read the contribution calendar; add a read-only PAT as
          # PROFILE_TOKEN to get the contribution tally as well.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python scripts/build_profile.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet --staged; then
            echo "board already current, nothing to commit"
          else
            git commit -m "Refresh shipping board"
            git push
          fi
